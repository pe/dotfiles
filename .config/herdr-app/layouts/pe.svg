<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 62">
  <!-- Drawn as Herdr's Settings draws its own layouts (frame/settings/main.js preview()):
       a 42px sidebar of 3px lines, cards with a 2px radius, in Catppuccin Mocha's colors. -->
  <rect x="0.5" y="0.5" width="107" height="61" rx="6" fill="#1e1e2e" stroke="#333342"/>
  <rect x="42" y="1" width="1" height="60" fill="#333342"/>
  <!-- brand row: icon, "Herdr", + -->
  <rect x="5" y="4" width="5" height="5" rx="1.5" fill="#cdd6f4"/>
  <rect x="12" y="5" width="14" height="3" rx="1.5" fill="#6d6d77"/>
  <rect x="35" y="6" width="4" height="1" fill="#6d6d77"/><rect x="36.5" y="4.5" width="1" height="4" fill="#6d6d77"/>
  <!-- a space and its tabs, the shown one selected -->
  <rect x="5" y="14" width="22" height="3" rx="1.5" fill="#6d6d77"/>
  <rect x="3" y="19" width="37" height="7" rx="2" fill="#323241"/>
  <rect x="10" y="21" width="24" height="3" rx="1.5" fill="#89b4fa"/>
  <rect x="10" y="28" width="20" height="3" rx="1.5" fill="#6d6d77"/>
  <!-- a second space -->
  <rect x="5" y="35" width="18" height="3" rx="1.5" fill="#6d6d77"/>
  <rect x="10" y="42" width="24" height="3" rx="1.5" fill="#6d6d77"/>
  <!-- quota footer -->
  <rect x="1" y="52" width="41" height="1" fill="#333342"/>
  <rect x="5" y="55" width="8" height="3" rx="1.5" fill="#6d6d77"/><rect x="16" y="55" width="8" height="3" rx="1.5" fill="#6d6d77"/>
  <!-- the shown tab's pane -->
  <rect x="47.5" y="4.5" width="56" height="53" rx="2" fill="#1e1e2e" stroke="#333342"/>
</svg>
